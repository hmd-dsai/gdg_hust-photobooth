services:
  photobooth:
    build:
      context: .
      dockerfile: Dockerfile
    # Pinned explicitly -- without this, compose derives the image name from
    # the checkout directory's name (e.g. "gdg_hust-photobooth-photobooth"),
    # which silently changes if anyone clones this repo into a differently
    # named folder. That would break any `docker save`/`docker pull` command
    # written against a fixed name (see README's distribution instructions).
    image: gdg-photobooth:latest
    container_name: gdg-photobooth
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./output:/app/output
      # NOTE: no ~/.cache/huggingface mount -- the model is now baked into the
      # image at build time (see Dockerfile). Mounting the host's cache here
      # would SHADOW that baked-in copy with an empty directory on any laptop
      # that doesn't already have it populated, defeating the point.
    environment:
      - PYTHONUNBUFFERED=1
      - IMGUR_CLIENT_ID=${IMGUR_CLIENT_ID:-}
